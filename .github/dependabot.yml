version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "06:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 5
    groups:
      react-rendering:
        patterns:
          - react
          - react-dom
          - "@react-three/fiber"
          - "@react-three/drei"
      development-patches:
        dependency-type: development
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "06:30"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 2
